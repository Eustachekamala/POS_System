services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pos_system_db
      POSTGRES_USER: eustache
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "9080:8080"

volumes:
  postgres_data: