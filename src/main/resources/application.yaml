spring:
  application:
    name: POS_System

  datasource:
    url: jdbc:postgresql://localhost:5434/pos_system_db
    username: eustache
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
#      jakarta:
#        persistence:
#          schema-generation:
#            scripts:
#              action: create
#              create-target: src/main/resources/db/migration/V1__init_schema.sql
#            create-source: metadata

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    user: postgres
    password: password
    baseline-description: "Initial migration"
    baseline-version: 0

server:
  port: 5000
  servlet:
    context-path: /api/v1/pos
