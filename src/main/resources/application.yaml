spring:
  application:
    name: POS_System

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_system_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 5000
  servlet:
    context-path: /api/v1/pos
